<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Burger Menu</title>
    <link rel="stylesheet" href="CSS.css">
</head>

<body>

<section id="burger-menu">

<div class="title-box">
    <h1 class="burger-title">BURGER MENU</h1>
</div>

<div class="burger-panel">
    <img src="veg burger.jpg" alt="Veg Burger">
    <h3>VEG BURGER</h3>
    <p class="price">$3.99</p>
   <button class="order-btn" onclick="openPopup()">
    Order Now
</button>
</div>

<div class="burger-panel">
    <img src="Veg cheese burger.jpg" alt="Cheese Burger">
    <h3>CHEESE BURGER</h3>
    <p class="price">$4.99</p>
    <button class="order-btn" onclick="openPopup()">
    Order Now
</button>
</div>

<div class="burger-panel">
    <img src="mushrooms burger.jpg" alt="Mushroom Burger">
    <h3>MUSHROOM BURGER</h3>
    <p class="price">$5.49</p>
    <button class="order-btn" onclick="openPopup()">
    Order Now
</button>
</div>

</section>

<!-- Popup -->
<div id="orderPopup" class="popup">

    <div class="popup-content">
        <h2>☕ Order Confirmed!</h2>
        <p>Thank you for your order.</p>
        <p>Your delicious burger is being prepared.</p>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<script src="Java.js"></script>

</body>
</html>
